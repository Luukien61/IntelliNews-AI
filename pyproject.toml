[project]
name = "intellinews-ai"
version = "0.1.0"
description = "AI Service for IntelliNews - TTS, Recommendation, and Summarization"
authors = [
    {name = "IntelliNews Team"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "vieneu>=1.0.0,<2.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.0,<2.0.0",
    "boto3>=1.42.44,<2.0.0",
    "requests>=2.32.5,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "psycopg[binary]>=3.3.2,<4.0.0",
    "transformers>=4.40.0,<5.0.0",
    "torch>=2.2.0,<3.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "numpy>=2.0.2,<3.0.0",
    "underthesea>=6.8.0,<7.0.0",
    "redis>=5.0.0,<6.0.0",
    "pgvector>=0.3.0,<1.0.0",
    "grpcio>=1.78.0,<2.0.0",
    "grpcio-tools>=1.78.0,<2.0.0",
    "protobuf>=6.33.5,<7.0.0",
    "confluent-kafka>=2.13.2,<3.0.0",
    "hdbscan>=0.8.42,<1.0.0",
    "sentence-transformers>=3.0.0,<4.0.0",
    "umap-learn>=0.5.0,<1.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "api", "config", "db"]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0",
]

